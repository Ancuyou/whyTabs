<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo Kill Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-header">
    <div>
        <h1>Todo Kill</h1>
        <p class="subtitle">Settings and history</p>
    </div>
    <button id="export-btn" class="btn">Export JSON</button>
</header>

<section class="card">
    <h2>Settings</h2>
    <label class="setting-row">
        <input type="checkbox" id="setting-bubble">
        <span>Show intent bubble</span>
    </label>
    <label class="setting-row">
        <input type="checkbox" id="setting-indicator">
        <span>Show tab indicator</span>
    </label>
    <div class="setting-field">
        <label for="setting-allowlist">Allowlist domains (one per line)</label>
        <textarea id="setting-allowlist" rows="4" placeholder="example.com"></textarea>
    </div>
    <div class="setting-field">
        <label for="setting-blocklist">Blocklist domains (one per line)</label>
        <textarea id="setting-blocklist" rows="4" placeholder="news.ycombinator.com"></textarea>
    </div>
    <div class="setting-hint">Allowlist has priority. Leave empty to allow all.</div>
</section>

<section class="card">
    <h2>History</h2>
    <div class="filters">
        <input type="date" id="filter-date">
        <input type="text" id="filter-search" placeholder="Search intent">
        <button id="filter-refresh" class="btn ghost">Refresh</button>
    </div>
    <div id="history-list" class="history-list"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
