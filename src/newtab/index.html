<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="intent-prompt">
    <h1>🔍 Why this tab?</h1>
    <form id="intent-form">
        <input type="text" id="intent-input" placeholder="research, break, buy, learn..." autocomplete="off" autofocus>
        <div class="actions">
            <button type="submit">FOCUS & OPEN</button>
            <button type="button" id="skip-btn">JUST BROWSE</button>
        </div>
    </form>
    <p class="hint">Enter to track • Esc to skip • 100% Local</p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
