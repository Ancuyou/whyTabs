<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo Kill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="panel-header">
    <div class="title-row">
        <h1>Todo Kill</h1>
        <span class="version-pill">Side Panel</span>
    </div>
    <div class="stats-summary">
        <div class="stat-item">
            <div class="stat-value" id="killed-count">0</div>
            <div class="stat-label">Killed</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="focus-minutes">0</div>
            <div class="stat-label">Minutes</div>
        </div>
    </div>
</header>

<section class="section">
    <div class="section-title">Active Tasks</div>
    <div id="task-list" class="task-list"></div>
</section>

<section class="section">
    <div class="section-title">Tips</div>
    <div class="tips-card">
        <p>Use the kill button to close distracting tabs and log focus time.</p>
        <p>Keep this panel open to see live timers update every second.</p>
    </div>
</section>

<canvas id="kill-canvas" class="kill-canvas"></canvas>
<script type="module" src="app.js"></script>
</body>
</html>
